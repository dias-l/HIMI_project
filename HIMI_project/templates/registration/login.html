{% extends 'base.html' %}

{% block content %}
<style>
    /* 1. ON CACHE LE PANNEAU GAUCHE ET LA NAVBAR COMPLÈTE */
    .left-panel { display: none !important; }
    .navbar, nav, header { display: none !important; } /* <-- Cache complètement la barre de navigation */
    
    /* 2. CENTRE TOTAL ET FOND UNIFIÉ */
    .right-panel { 
        display: flex !important; 
        align-items: center !important; 
        justify-content: center !important; 
        background-color: var(--marine-blue) !important; 
        width: 100vw !important;  
        height: 100vh !important; 
        padding: 0 !important;
        margin: 0 !important;
        position: fixed; /* Bloque le fond pour éviter les fuites blanches */
        top: 0;
        left: 0;
        z-index: 9999; /* Sécurité augmentée pour passer par-dessus tout le reste */
    }

    /* On force le container de base à ne pas limiter la largeur */
    .right-panel > .container {
        max-width: 100% !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }

    .login-wrapper {
        width: 100%;
        max-width: 420px;
        animation: fadeIn 0.5s ease-out;
    }

    .login-card {
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        padding: 50px 40px;
        border: none;
    }

    .login-title {
        font-weight: 800;
        color: var(--marine-blue);
        margin-bottom: 8px;
        text-align: center;
        font-size: 2rem;
    }

    .login-subtitle {
        color: #64748b;
        text-align: center;
        margin-bottom: 35px;
        font-size: 1rem;
    }

    /* Style du formulaire */
    .custom-login-form p { margin-bottom: 1.5rem; }
    .custom-login-form label {
        font-weight: 600;
        color: #334155;
        margin-bottom: 8px;
        display: block;
        font-size: 0.9rem;
    }
    .custom-login-form input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #f1f5f9;
        border-radius: 12px;
        background-color: #f8fafc;
        transition: 0.3s;
    }
    .custom-login-form input:focus {
        border-color: var(--light-blue, #00509e);
        background-color: white;
        outline: none;
    }

    .btn-login {
        background-color: var(--marine-blue);
        color: white;
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        font-weight: 700;
        border: none;
        margin-top: 10px;
        transition: 0.3s;
    }
    .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="login-wrapper">
    <div class="card login-card">
        <h2 class="login-title">Bienvenue ! </h2>
        <p class="login-subtitle">Connectez-vous à votre portail HIMI</p>
        
        <form method="post" class="custom-login-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-login shadow-sm">
                Se connecter
            </button>
        </form>
    </div>
</div>
{% endblock %}
