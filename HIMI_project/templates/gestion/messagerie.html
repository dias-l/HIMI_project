{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">💬 Messagerie</h2>
    <a href="{% url 'nouveau_message' %}" class="btn btn-primary">+ Nouveau Message</a>
</div>

<div class="list-group shadow-sm">
    {% for contact in contacts %}
        <a href="{% url 'discussion' contact.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
            <div class="fw-bold text-primary">{{ contact.first_name }} {{ contact.last_name }}</div>
            <span class="badge bg-secondary rounded-pill">Ouvrir</span>
        </a>
    {% empty %}
        <div class="alert alert-info">Vous n'avez aucune conversation active. Cliquez sur "Nouveau Message" pour commencer.</div>
    {% endfor %}
</div>
{% endblock %}
