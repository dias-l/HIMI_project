{% extends 'base.html' %}

{% block content %}

<h4 class="mb-4" style="color: var(--marine-blue); font-weight: 700;">Dernières actualités</h4>

<div class="d-flex flex-column gap-3">
    {% for actualite in actualites %}
    
    <div class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
        <div class="card-body p-4">
            
            <div class="d-flex align-items-center mb-3">
                <div class="d-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px; background-color: var(--marine-blue); color: white; border-radius: 50%; font-weight: bold; font-size: 1.2rem;">
                    H
                </div>
                
                <div>
                    <h5 class="mb-1 fw-bold text-dark">{{ actualite.titre }}</h5>
                    <p class="mb-0 text-muted" style="font-size: 0.85rem;">
                        {{ actualite.date_publication|date:"d F Y" }}
                    </p>
                </div>
            </div>

            <p class="card-text text-secondary mb-3" style="line-height: 1.6;">
                {{ actualite.contenu|linebreaksbr }}
            </p>

            <a href="#" class="text-decoration-none fw-bold" style="color: var(--marine-blue); font-size: 0.9rem;">
                Lire la suite ›
            </a>

        </div>
    </div>

    {% empty %}
    <div class="text-center py-5">
        <p class="text-muted fst-italic">Aucune actualité à afficher.</p>
    </div>
    {% endfor %}
</div>

{% endblock %}
